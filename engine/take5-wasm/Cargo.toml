[package]
name = "take5-wasm"
version = "0.1.0"
edition = "2021"
description = "WASM bindings: engine bots (greedy/mc/neural search) for the web UI."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
take5-core = { path = "../take5-core" }
wasm-bindgen = "0.2"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
