[package]
name = "take5-py"
version = "0.1.0"
edition = "2021"
description = "Python bindings for the take5-core engine."
license = "MIT"

[lib]
name = "take5_engine"
crate-type = ["cdylib"]

[dependencies]
take5-core = { path = "../take5-core" }
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py310"] }
