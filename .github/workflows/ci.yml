name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  web-lint:
    name: Web Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: CI script (install, lint, build)
        run: npm run ci

  python-smoke:
    name: Python Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      # The smoke test only needs pyspiel + numpy, so skip the heavy
      # training dependencies (torch, transformers, LightZero, ...).
      - name: Install smoke-test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'open-spiel==1.6' numpy ruff black
          pip install --no-deps .

      - name: Smoke test import & game registration
        run: |
          python - <<'PY'
          import pyspiel, take5bot.openspiel_take5 as mod
          pyspiel.register_game(mod.GAME_TYPE, mod.TakeFiveGame)
          g = pyspiel.load_game('take5')
          s = g.new_initial_state()
          print('Loaded take5. Initial state:', str(s))
          PY

      - name: Style (ruff) check (non-blocking)
        continue-on-error: true
        run: ruff check .

      - name: Black formatting check (non-blocking)
        continue-on-error: true
        run: black --check .
